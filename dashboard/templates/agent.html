<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta http-equiv="Cache-Control" content="no-store"/>
  <title>Agent · PriyanshCompute</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #070b14;
      color: #e2e8f0;
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
    }
    .hero {
      background: linear-gradient(125deg, #1e1452 0%, #0f172a 52%, #082f49 100%);
      border-bottom: 1px solid #273347;
      padding: 14px 20px;
      flex-shrink: 0;
    }
    .hero-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .hero h1 {
      margin: 0;
      font-size: 1rem;
      color: #c4b5fd;
      font-weight: 700;
    }
    .hero .muted { color: #64748b; font-size: 11px; }
    .market-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }
    .mpill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 10px;
      border-radius: 999px;
      background: #151b2e;
      border: 1px solid #273347;
      font-size: 11px;
      font-family: ui-monospace, monospace;
      color: #94a3b8;
    }
    .mpill .val { color: #fcd34d; font-weight: 700; }
    .mpill .up  { color: #34d399; }
    .mpill .dn  { color: #c084fc; }

    /* chat area */
    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .suggestions {
      margin: auto 0;
      padding: 24px 0 8px 0;
    }
    .suggestions h2 {
      margin: 0 0 14px 0;
      font-size: 0.85rem;
      color: #475569;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .suggest-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 8px;
    }
    .suggest-btn {
      text-align: left;
      background: #101624;
      border: 1px solid #273347;
      border-radius: 10px;
      padding: 12px 14px;
      color: #94a3b8;
      font-size: 13px;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
      line-height: 1.45;
    }
    .suggest-btn:hover {
      border-color: #6366f1;
      color: #e2e8f0;
    }

    /* message bubbles */
    .msg {
      display: flex;
      gap: 10px;
      max-width: 820px;
      width: 100%;
    }
    .msg.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg.agent { align-self: flex-start; }
    .avatar {
      width: 30px;
      height: 30px;
      border-radius: 999px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
    }
    .avatar.agent-av { background: #312e81; color: #a78bfa; }
    .avatar.user-av  { background: #0c4a6e; color: #7dd3fc; }
    .bubble {
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.6;
      max-width: calc(100% - 44px);
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.user .bubble {
      background: #0c3057;
      border: 1px solid #164e7e;
      color: #bae6fd;
      border-radius: 12px 12px 2px 12px;
    }
    .msg.agent .bubble {
      background: #101624;
      border: 1px solid #273347;
      color: #e2e8f0;
      border-radius: 12px 12px 12px 2px;
    }
    .bubble code {
      background: #0f172a;
      padding: 1px 5px;
      border-radius: 4px;
      font-family: ui-monospace, monospace;
      font-size: 12px;
      color: #a78bfa;
    }
    .cursor {
      display: inline-block;
      width: 2px;
      height: 14px;
      background: #a78bfa;
      margin-left: 2px;
      vertical-align: middle;
      animation: blink 0.9s step-end infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }

    .err-bubble {
      background: #450a0a;
      border: 1px solid #7f1d1d;
      color: #fecaca;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
    }

    /* input bar */
    .input-bar {
      flex-shrink: 0;
      border-top: 1px solid #1e2740;
      background: #0a0d17;
      padding: 12px 20px;
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }
    .input-wrap {
      flex: 1;
      background: #101624;
      border: 1px solid #273347;
      border-radius: 10px;
      display: flex;
      align-items: flex-end;
      padding: 8px 12px;
      gap: 8px;
      transition: border-color 0.15s;
    }
    .input-wrap:focus-within { border-color: #6366f1; }
    textarea#chat-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #e2e8f0;
      font-size: 13px;
      font-family: system-ui, sans-serif;
      resize: none;
      max-height: 120px;
      line-height: 1.5;
      padding: 0;
    }
    textarea#chat-input::placeholder { color: #475569; }
    button#send-btn {
      background: #4f46e5;
      border: none;
      border-radius: 7px;
      color: #fff;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.15s;
    }
    button#send-btn:hover:not(:disabled) { background: #6366f1; }
    button#send-btn:disabled { background: #1e2740; cursor: not-allowed; }
    button#clear-btn {
      background: transparent;
      border: 1px solid #273347;
      border-radius: 8px;
      color: #64748b;
      font-size: 12px;
      padding: 0 10px;
      height: 36px;
      cursor: pointer;
      flex-shrink: 0;
      transition: border-color 0.15s, color 0.15s;
    }
    button#clear-btn:hover { border-color: #475569; color: #94a3b8; }

    @media (max-width: 600px) {
      .hero { padding: 10px 14px; }
      .chat-area { padding: 12px 14px; }
      .input-bar { padding: 10px 14px; }
      .suggest-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  {% include "nav.html" %}

  <div class="hero">
    <div class="hero-row">
      <div>
        <h1>&#x25C6; BTC Latency-Arb Agent</h1>
        <p class="muted" style="margin:4px 0 0 0;">Ask about current signals, strategy performance, or deployment</p>
      </div>
      <div id="hero-status" class="muted"></div>
    </div>
    <div class="market-pills" id="market-pills"></div>
  </div>

  <div class="chat-area" id="chat-area">
    <div class="suggestions" id="suggestions">
      <h2>Suggested questions</h2>
      <div class="suggest-grid">
        <button class="suggest-btn" onclick="sendSuggestion(this)">What's the current BTC price vs PTB? Is there a live signal right now?</button>
        <button class="suggest-btn" onclick="sendSuggestion(this)">How is paper trading performing? What's the win rate and total PnL?</button>
        <button class="suggest-btn" onclick="sendSuggestion(this)">What time of day UTC should I run the algo for best results?</button>
        <button class="suggest-btn" onclick="sendSuggestion(this)">Explain the L1 vs L2 signal difference and when each fires.</button>
        <button class="suggest-btn" onclick="sendSuggestion(this)">What are the risks of going live with real money on this strategy right now?</button>
        <button class="suggest-btn" onclick="sendSuggestion(this)">What does the final-seconds anomaly mean and how do we trade it?</button>
      </div>
    </div>
  </div>

  <div class="input-bar">
    <button id="clear-btn" onclick="clearChat()" title="Clear conversation">Clear</button>
    <div class="input-wrap">
      <textarea
        id="chat-input"
        rows="1"
        placeholder="Ask about the strategy, live signals, performance..."
        onkeydown="handleKey(event)"
        oninput="autoResize(this)"
      ></textarea>
      <button id="send-btn" onclick="send()" title="Send (Enter)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
  </div>

  <script>
  (function () {
    var messages = [];
    var isStreaming = false;

    // ── Fetch live market context for hero ──────────────────────────────────
    function loadHeroContext() {
      fetch('/api/poly_live?depth=3')
        .then(function(r) { return r.json(); })
        .then(function(d) {
          var pills = document.getElementById('market-pills');
          var status = document.getElementById('hero-status');
          var html = '';

          if (d.btc_usd != null) {
            html += '<span class="mpill">BTC <span class="val">$' +
              Number(d.btc_usd).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2}) +
              '</span></span>';
          }

          (d.markets || []).forEach(function(m) {
            var up = m.up || {};
            var ptb = m.price_to_beat;
            var iv = m.interval_minutes;
            var sr = m.seconds_left;
            if (!ptb) return;
            var upMid = ((parseFloat(up.bid || 0) + parseFloat(up.ask || 0)) / 2 * 100).toFixed(1);
            var mm = Math.floor(sr / 60), ss = String(sr % 60).padStart(2, '0');
            html += '<span class="mpill">' + iv + 'm PTB <span class="val">$' +
              Number(ptb).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2}) +
              '</span> · UP <span class="up">' + upMid + '¢</span> · ' +
              mm + ':' + ss + 's</span>';
          });

          pills.innerHTML = html;
          if (d.error) {
            status.textContent = 'Feed offline';
          } else {
            status.textContent = 'Live';
          }
        })
        .catch(function() {
          document.getElementById('hero-status').textContent = 'Feed offline';
        });
    }
    loadHeroContext();
    setInterval(loadHeroContext, 5000);

    // ── Textarea auto-resize ────────────────────────────────────────────────
    window.autoResize = function(el) {
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 120) + 'px';
    };

    // ── Enter to send (Shift+Enter = newline) ───────────────────────────────
    window.handleKey = function(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    };

    // ── Suggested question click ────────────────────────────────────────────
    window.sendSuggestion = function(btn) {
      var input = document.getElementById('chat-input');
      input.value = btn.textContent.trim();
      autoResize(input);
      send();
    };

    // ── Clear conversation ──────────────────────────────────────────────────
    window.clearChat = function() {
      messages = [];
      var area = document.getElementById('chat-area');
      // Restore suggestions
      area.innerHTML = '<div class="suggestions" id="suggestions"><h2>Suggested questions</h2><div class="suggest-grid">' +
        ['What\'s the current BTC price vs PTB? Is there a live signal right now?',
         'How is paper trading performing? What\'s the win rate and total PnL?',
         'What time of day UTC should I run the algo for best results?',
         'Explain the L1 vs L2 signal difference and when each fires.',
         'What are the risks of going live with real money on this strategy right now?',
         'What does the final-seconds anomaly mean and how do we trade it?'].map(function(q) {
           return '<button class="suggest-btn" onclick="sendSuggestion(this)">' + escHtml(q) + '</button>';
         }).join('') +
        '</div></div>';
    };

    // ── Render inline markdown (bold, code, newlines) ───────────────────────
    function renderMarkdown(text) {
      return escHtml(text)
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
        .replace(/\n/g, '<br>');
    }

    function escHtml(s) {
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // ── Append a message bubble ─────────────────────────────────────────────
    function appendBubble(role, text, id) {
      var area = document.getElementById('chat-area');
      var sugg = document.getElementById('suggestions');
      if (sugg) sugg.remove();

      var div = document.createElement('div');
      div.className = 'msg ' + role;
      if (id) div.id = id;

      var initials = role === 'user' ? 'You' : 'AI';
      var avClass  = role === 'user' ? 'user-av' : 'agent-av';

      div.innerHTML =
        '<div class="avatar ' + avClass + '">' + initials + '</div>' +
        '<div class="bubble" id="' + (id ? id + '-text' : '') + '">' +
          (text ? renderMarkdown(text) : '') +
        '</div>';

      area.appendChild(div);
      area.scrollTop = area.scrollHeight;
      return div;
    }

    // ── Send message ────────────────────────────────────────────────────────
    window.send = function() {
      if (isStreaming) return;
      var input = document.getElementById('chat-input');
      var text  = input.value.trim();
      if (!text) return;

      input.value = '';
      input.style.height = 'auto';
      document.getElementById('send-btn').disabled = true;

      messages.push({ role: 'user', content: text });
      appendBubble('user', text);

      var agentId = 'msg-' + Date.now();
      var agentDiv = appendBubble('agent', '', agentId);
      var textEl = document.getElementById(agentId + '-text');
      textEl.innerHTML = '<span class="cursor"></span>';

      isStreaming = true;
      var accumulated = '';

      fetch('/api/agent', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: messages }),
      })
      .then(function(res) {
        if (!res.ok) {
          return res.json().then(function(d) {
            throw new Error(d.error || 'HTTP ' + res.status);
          });
        }
        var reader  = res.body.getReader();
        var decoder = new TextDecoder();
        var buffer  = '';

        function read() {
          return reader.read().then(function(chunk) {
            if (chunk.done) {
              done();
              return;
            }
            buffer += decoder.decode(chunk.value, { stream: true });
            var parts = buffer.split('\n\n');
            buffer = parts.pop();
            parts.forEach(function(part) {
              if (!part.startsWith('data: ')) return;
              var raw = part.slice(6).trim();
              if (raw === '[DONE]') { done(); return; }
              try {
                var evt = JSON.parse(raw);
                if (evt.error) throw new Error(evt.error);
                if (evt.text) {
                  accumulated += evt.text;
                  textEl.innerHTML = renderMarkdown(accumulated) + '<span class="cursor"></span>';
                  var area = document.getElementById('chat-area');
                  area.scrollTop = area.scrollHeight;
                }
              } catch (e) {
                showError(textEl, e.message);
                done();
              }
            });
            return read();
          });
        }

        return read();
      })
      .catch(function(e) {
        showError(textEl, e.message);
        done();
      });

      function done() {
        isStreaming = false;
        document.getElementById('send-btn').disabled = false;
        // Remove blinking cursor, finalize text
        textEl.innerHTML = renderMarkdown(accumulated);
        if (accumulated) {
          messages.push({ role: 'assistant', content: accumulated });
        }
      }

      function showError(el, msg) {
        el.innerHTML = '<span style="color:#fca5a5;">Error: ' + escHtml(msg) + '</span>';
      }
    };

  })();
  </script>
</body>
</html>
